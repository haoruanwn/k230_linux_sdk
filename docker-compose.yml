version: '3.8'

services:
  k230-dev:
    build: 
      context: .
      dockerfile: Dockerfile
    image: k230-sdk-env:v1
    container_name: k230_build_env
    hostname: k230
    privileged: true
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
    
    # 网络配置：映射 SSH 端口
    # 宿主机的 2222 端口 -> 容器的 22 端口
    ports:
      - "2222:22"
    
    # 挂载配置
    volumes:
      # 1. 源码映射：当前目录 -> /workspace
      - .:/workspace
      # 2. 工具链映射：宿主机的 toolchain 目录 -> /opt/toolchain
      - ./toolchain:/opt/toolchain
    
    # 环境参数
    environment:
      - TZ=Asia/Shanghai